name: capri

services:
  app:
    build:
      context: .
      args:
        # Baked into the SPA bundle at build time -- changing these requires
        # `docker compose up -d --build`, not just a restart.
        BASE_PATH: ${BASE_PATH:-/}
        CAL_URL: ${CAL_URL:-https://cal.com/capturesbycapri/appointment}
        # Set by the shell invoking `docker compose build`, e.g.:
        #   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        # Not read from .env: it must reflect the commit actually being built,
        # not a value that goes stale the moment it's written down.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      # Always production, not passed through from .env: the image only
      # installs production dependencies (no pino-pretty), and "production"
      # is also what makes the admin session cookie `secure` -- correct
      # once Caddy is in front on the LXC. Testing the admin login against
      # this container directly over plain http://localhost will fail to
      # persist the session for that reason; that's expected.
      NODE_ENV: production
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Container-network hostname:port, not the host-mapped 5433 the root
      # .env uses for `pnpm dev` running natively against this same Postgres.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # The bind mount below, not the host's relative ./media.
      MEDIA_DIR: ${MEDIA_DIR:-/app/media}
      # Always true: this container has no separate Vite dev server, so
      # api-server must be the one serving the built SPA.
      SERVE_STATIC: "true"
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 14 * * *}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-America/Chicago}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SITE_URL: ${SITE_URL:-}
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CAL_WEBHOOK_SECRET: ${CAL_WEBHOOK_SECRET:-}
      ABSTRACT_API_KEY: ${ABSTRACT_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Same directory `pnpm dev` reads MEDIA_DIR from -- one copy of the
      # photos either way.
      - ${HOST_MEDIA_DIR}:${MEDIA_DIR:-/app/media}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Matches the Supabase-hosted version this project is migrating off (17.6.1.127),
    # so a pg_restore of the production dump behaves identically.
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Deterministic collation so ORDER BY matches production.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 5433 on the host to avoid clashing with a natively installed Postgres.
      - "5433:5432"
    volumes:
      - ${POSTGRES_DATA_VOLUME}:/var/lib/postgresql/data
      # Read-only so `psql -f /db/sql/...` works inside the container.
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      # pgAdmin 9 validates this address and crash-loops on startup if it fails.
      # It rejects both a missing TLD ("dev@local") and reserved TLDs
      # (".local", ".test"), so use example.com -- reserved by RFC 2606 for
      # exactly this and accepted by the validator.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ${PGADMIN_DATA_VOLUME}:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin:

# Note: deliberately no /docker-entrypoint-initdb.d mount. Init scripts run only
# when the data volume is empty, which is exactly wrong for the
# restore -> find a mapping bug -> fix -> restore loop this migration needs.
# The ./db bind mount plus scripts/db/*.sh make every step re-runnable instead.
# Use `pnpm db:reset` when you actually want a clean slate.
