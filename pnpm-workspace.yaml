# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add a
# `minimumReleaseAgeExclude` allowlist here. Only consider doing this for
# packages released by organizations with an impeccable security posture
# (e.g. react from Meta, typescript from Microsoft). Even then, remove the
# exclusion once the 1-day window has passed.
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/cookie-parser': ^1.4.9
  '@types/node': ^25.3.3
  '@types/pg': ^8.15.6
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cookie-parser: ^1.4.7
  dotenv: ^17.2.4
  # Keep drizzle-kit and drizzle-orm as a matched pair. A mismatch generates
  # plausible-looking but wrong SQL, especially around identity columns and
  # numeric modes. 0.31.x kit pairs with 0.45.x orm. Avoid the 1.0.0-rc line.
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  node-cron: ^4.2.1
  pg: ^8.16.3
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - unrs-resolver

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable,
  # this overrides it. Keep: drizzle-kit is now a real dependency.
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  # Floor esbuild above the CVE-affected releases. A caret rather than an exact
  # pin so drizzle-kit's vendored esbuild can co-resolve.
  esbuild: "^0.27.3"
