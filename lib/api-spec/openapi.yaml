openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Captures By Capri — Photography portfolio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gallery
    description: Portfolio gallery images
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /gallery:
    get:
      operationId: listGallery
      tags: [gallery]
      summary: List all gallery images
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of gallery images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryImage"
    post:
      operationId: createGalleryImage
      tags: [gallery]
      summary: Add a gallery image (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryImageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryImage"

  /gallery/categories:
    get:
      operationId: listGalleryCategories
      tags: [gallery]
      summary: List all gallery categories
      responses:
        "200":
          description: List of categories with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryCategory"

  /gallery/{id}:
    get:
      operationId: getGalleryImage
      tags: [gallery]
      summary: Get a single gallery image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gallery image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryImage"
        "404":
          description: Not found
    delete:
      operationId: deleteGalleryImage
      tags: [gallery]
      summary: Delete a gallery image (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GalleryImage:
      type: object
      required: [id, title, url, category, displayOrder, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
        category:
          type: string
        displayOrder:
          type: integer
        featured:
          type: boolean
        createdAt:
          type: string

    GalleryImageInput:
      type: object
      required: [title, url, category]
      properties:
        title:
          type: string
        url:
          type: string
        category:
          type: string
        displayOrder:
          type: integer
        featured:
          type: boolean

    GalleryCategory:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
